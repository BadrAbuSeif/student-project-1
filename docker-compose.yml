services:
  api:
    build: .
    ports:
      - "8006:8000"
    environment:
      DATABASE_URL: mysql+pymysql://root:rootpass@mysql:3306/appdb
      MONGO_URL: mongodb://mongo:27017
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_started

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: appdb
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass"]
      interval: 5s
      retries: 10

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db

volumes:
  mysql_data:
  mongo_data: